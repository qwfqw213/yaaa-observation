<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정기관측회 신청</title>
<style>
  :root{
    --bg:#0a0e1a; --card:rgba(20,28,48,.72);
    --line:rgba(120,150,220,.18); --txt:#e8edf7; --muted:#9aa7c7;
    --accent:#6ea8ff; --accent2:#a98bff; --ok:#46d6a0; --warn:#ffd36e; --bad:#ff7a7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:var(--txt);
    background:radial-gradient(120% 120% at 50% -10%,#16213f 0%,#0a0e1a 55%);
    min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px 64px;position:relative;z-index:2}
  .badge{display:inline-block;font-size:12px;letter-spacing:.18em;color:var(--accent);
    border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:rgba(110,168,255,.08)}
  h1{font-size:30px;line-height:1.25;margin:18px 0 6px;font-weight:800;
    background:linear-gradient(90deg,#cfe0ff,#b9a7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:15px;margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px;margin:16px 0;backdrop-filter:blur(8px);box-shadow:0 8px 40px rgba(0,0,0,.35)}
  .info-row{display:flex;gap:10px;font-size:15px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .info-row:last-child{border-bottom:0}
  .info-row .k{color:var(--muted);min-width:64px}
  .info-row .v{color:var(--txt);font-weight:600}

  .count-label{color:var(--muted);font-size:13px;letter-spacing:.1em;text-align:center;margin-bottom:14px}
  .count{display:flex;justify-content:center;gap:10px}
  .seg{flex:1;max-width:84px;background:rgba(10,16,32,.6);border:1px solid var(--line);
    border-radius:14px;padding:14px 6px;text-align:center}
  .seg .n{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#dfe8ff}
  .seg .u{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.05em}

  .cap{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .cap .label{font-size:14px;color:var(--muted)}
  .cap .val{font-size:14px;font-weight:700}
  .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s}

  label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;font-size:16px;color:var(--txt);
    background:rgba(10,16,32,.6);border:1px solid var(--line);border-radius:12px;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,168,255,.15)}
  .btn{width:100%;margin-top:20px;padding:15px;font-size:17px;font-weight:800;color:#08101f;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border:0;border-radius:14px;cursor:pointer;
    transition:transform .08s, filter .2s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}

  .msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(70,214,160,.12);border:1px solid rgba(70,214,160,.4);color:#bff3df}
  .msg.warn{background:rgba(255,211,110,.12);border:1px solid rgba(255,211,110,.4);color:#ffe9b8}
  .msg.bad{background:rgba(255,122,122,.12);border:1px solid rgba(255,122,122,.4);color:#ffd2d2}

  .center{text-align:center}
  .hint{color:var(--muted);font-size:13px;text-align:center;margin-top:18px;line-height:1.6}
  .full-banner{text-align:center;padding:30px 10px}
  .full-banner .big{font-size:22px;font-weight:800;margin-bottom:6px}
  .hidden{display:none !important}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#08101f;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="wrap">
  <div class="center">
    <span class="badge">★ 정기관측회</span>
    <h1 id="evtTitle">정기관측회 신청</h1>
    <p class="sub" id="evtTagline">페르세우스의 별빛 아래에서</p>
  </div>

  <div class="card">
    <div class="info-row"><span class="k">📅 일시</span><span class="v" id="evtDate">-</span></div>
    <div class="info-row"><span class="k">📍 장소</span><span class="v" id="evtPlace">-</span></div>
    <div class="info-row"><span class="k">👥 정원</span><span class="v" id="evtCap">-</span></div>
  </div>

  <div class="card" id="stateCard">
    <div id="loadingState" class="center" style="padding:20px 0">
      <span class="spin"></span> <span style="color:var(--muted)">불러오는 중…</span>
    </div>

    <div id="beforeState" class="hidden">
      <div class="count-label">신청 시작까지</div>
      <div class="count">
        <div class="seg"><div class="n" id="cd">00</div><div class="u">일</div></div>
        <div class="seg"><div class="n" id="ch">00</div><div class="u">시간</div></div>
        <div class="seg"><div class="n" id="cm">00</div><div class="u">분</div></div>
        <div class="seg"><div class="n" id="cs">00</div><div class="u">초</div></div>
      </div>
      <p class="hint" id="openAtText">-</p>
    </div>

    <div id="openState" class="hidden">
      <div class="cap">
        <span class="label">신청 현황</span>
        <span class="val" id="capText">- / -</span>
      </div>
      <div class="bar"><i id="capBar"></i></div>
      <p class="hint" id="waitBanner" style="display:none;margin-top:12px;color:var(--warn)"></p>
      <p class="hint" id="prepNote" style="display:none;margin-top:12px"></p>

      <form id="form" autocomplete="off">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="홍길동" maxlength="20" required />
        <label for="sid">학번</label>
        <input id="sid" name="sid" type="text" inputmode="numeric" placeholder="20251234" maxlength="20" required />
        <button class="btn" id="submitBtn" type="submit">신청하기</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <div id="fullState" class="hidden full-banner">
      <div class="big">🌑 신청이 마감되었습니다</div>
      <div style="color:var(--muted)">정원이 모두 찼어요. 다음 관측회에서 만나요!</div>
    </div>

    <div id="closedState" class="hidden full-banner">
      <div class="big">신청이 종료되었습니다</div>
      <div style="color:var(--muted)">접수 기간이 지났어요.</div>
    </div>
  </div>

  <div class="card hidden" id="checkCard">
    <div style="font-size:14px;color:var(--muted);margin-bottom:2px">내 신청 확인</div>
    <label for="chkSid">학번</label>
    <input id="chkSid" type="text" inputmode="numeric" placeholder="20251234" maxlength="20" />
    <button class="btn" id="chkBtn" type="button">확인하기</button>
    <div class="msg" id="chkMsg"></div>
  </div>

  <p class="hint" id="contactText">-</p>
  <p class="hint" style="margin-top:6px">오류 문의: 관측차장 송원준 010-4573-0704</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, onSnapshot, writeBatch, increment, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   ⚙️  설정 (CONFIG)
   ========================================================================= */
const CONFIG = {
  // 화면에 보여줄 관측회 정보
  title:   "1차 정기관측회 신청",
  tagline: "페르세우스의 별빛 아래에서",
  date:    "2026년 9월 19일(토)~20일(일) 1박 2일",
  place:   "파주 축제 펜션",
  contact: "관측부장 이윤호 010-8323-8952"
};

// ⬇️ Firebase 콘솔에서 복사한 웹 앱 설정을 여기에 붙여넣기 (설정안내_Firebase.md 참고)
const firebaseConfig = {
  apiKey: "AIzaSyDE4OxN_ZUNAvoNsXkBdj3nBeU30CXKesI",
  authDomain: "yaaa-observation.firebaseapp.com",
  projectId: "yaaa-observation",
  storageBucket: "yaaa-observation.firebasestorage.app",
  messagingSenderId: "797504088505",
  appId: "1:797504088505:web:cc444df6461c237deeee68"
};

// 오픈시각·정원·표시정보는 어드민 페이지(admin.html)에서 관리합니다.
// Firestore 의 meta/state 문서에 값이 있으면 위 CONFIG 대신 그 값이 표시됩니다.

// 구글 시트 자동 기록 브리지 (어드민에서 시트 주소를 등록하면 동작)
const SHEET_BRIDGE = "https://script.google.com/macros/s/AKfycbzKblqEmZSMGShChP7gDwFWHiuWtnBwAirCC_R6ke2v-3-nWpdWY9UhU_O_mhsqLJPUAw/exec";
const SHEET_TOKEN  = "yaaa-sheet-2026";
/* ===================== 설정 끝 ===================== */

const PREP_LEAD_MS = 60000; // 오픈 1분 전부터 미리 입력 가능
const $ = id => document.getElementById(id);
const configured = firebaseConfig.projectId && !firebaseConfig.projectId.startsWith("여기에");

let db = null;
let state = { openTime:null, closeTime:null, capacity:0, count:0 };
let currentShown = null;

// 화면 정보 (기본값 = CONFIG, 어드민에서 설정하면 Firestore 값으로 덮어씀)
function applyDisplay(d){
  d = d || {};
  const t = d.title || CONFIG.title;
  $("evtTitle").textContent = t;
  document.title = t;
  $("evtTagline").textContent = d.tagline || CONFIG.tagline;
  $("evtDate").textContent    = d.date    || CONFIG.date;
  $("evtPlace").textContent   = d.place   || CONFIG.place;
  $("contactText").textContent = "문의: " + (d.contact || CONFIG.contact);
}
applyDisplay(null);

function pad(n){ return String(n).padStart(2,"0"); }
function fmtKST(ms){
  try{ return new Date(ms).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit",weekday:"short"}); }
  catch(e){ return new Date(ms).toLocaleString("ko-KR"); }
}
function show(which){
  if(currentShown===which) return;
  currentShown=which;
  ["loadingState","beforeState","openState","fullState","closedState"].forEach(s=>$(s).classList.add("hidden"));
  $(which).classList.remove("hidden");
}
function flash(type,text){ const m=$("msg"); m.className="msg show "+type; m.textContent=text; }

function render(){
  if(state.openTime==null) return;
  const now = Date.now();
  $("checkCard").classList.toggle("hidden", now < state.openTime);
  const remaining = state.capacity - state.count;
  $("evtCap").textContent = state.capacity + "명";

  if(now < state.openTime - PREP_LEAD_MS){ show("beforeState"); $("openAtText").textContent="오픈: "+fmtKST(state.openTime); return; }
  if(state.closeTime && now > state.closeTime){ show("closedState"); return; }
  if(remaining <= -300){ show("fullState"); return; }

  show("openState");
  const over = state.count >= state.capacity;
  $("capText").textContent = state.count + " / " + state.capacity + "명" + (over ? "  (예비 접수 중)" : "");
  $("waitBanner").style.display = over ? "block" : "none";
  if(over) $("waitBanner").textContent = "정원이 찼습니다. 지금 신청하면 예비 " + (state.count - state.capacity + 1) + "번으로 접수됩니다.";
  $("capBar").style.width = Math.min(100, state.count/state.capacity*100) + "%";
  applyPrepState(now);
}

function applyPrepState(now){
  const btn=$("submitBtn"), note=$("prepNote");
  if(now < state.openTime){
    const left=Math.max(0,Math.ceil((state.openTime-now)/1000));
    btn.disabled=true; btn.textContent=left+"초 후 신청 시작";
    note.style.display="block"; note.textContent="지금 이름과 학번을 미리 입력해 두세요. 시작되면 바로 신청됩니다.";
  }else if(!btn.dataset.opened){
    btn.dataset.opened="1"; btn.disabled=false; btn.textContent="신청하기"; note.style.display="none";
  }
}

/* ===== 구글 시트 기록 (보조 기록용, 실패해도 신청에는 영향 없음) ===== */
function toSheet(name, sid, seq){
  try{
    const ifr=document.createElement("iframe");
    ifr.style.display="none";
    ifr.name="sb_"+Math.random().toString(36).slice(2);
    document.body.appendChild(ifr);
    const f=document.createElement("form");
    f.method="POST"; f.action=SHEET_BRIDGE; f.target=ifr.name; f.acceptCharset="utf-8";
    const v={ token:SHEET_TOKEN, action:"append", name:name, sid:sid, seq:seq,
              ts:new Date().toLocaleString("sv-SE") };
    for(const k in v){
      const i=document.createElement("input");
      i.type="hidden"; i.name=k; i.value=v[k]; f.appendChild(i);
    }
    document.body.appendChild(f); f.submit();
    setTimeout(()=>{ try{ f.remove(); ifr.remove(); }catch(e){} }, 60000);
  }catch(e){ /* 시트 기록 실패는 무시 — 원본은 Firestore */ }
}

/* ===== 데모 모드 (Firebase 미설정 시) ===== */
function demoMode(){
  state.openTime = Date.now()+60000; state.capacity=50; state.count=0;
  render();
  $("form").addEventListener("submit",(e)=>{ e.preventDefault(); flash("warn","데모 모드입니다. Firebase 설정을 완료하면 실제 신청이 저장됩니다."); });
}

/* ===== Firebase 모드 ===== */
function firebaseMode(){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  const stateRef = doc(db,"meta","state");

  // 실시간 구독: 정원/카운트/명단이 모두에게 즉시 반영
  onSnapshot(stateRef,(snap)=>{
    if(!snap.exists()){ show("loadingState"); return; }
    const d=snap.data();
    applyDisplay(d);
    state.openTime = d.openTime;
    state.closeTime = d.closeTime || null;
    state.capacity = d.capacity;
    state.count = d.count || 0;
    render();
  },(err)=>{ console.error(err); flash("bad","서버 연결에 문제가 있어요."); });


  $("form").addEventListener("submit", onSubmit);
  $("chkBtn").addEventListener("click", onCheck);
}

function chkFlash(type,text){ const m=$("chkMsg"); m.className="msg show "+type; m.style.whiteSpace="pre-line"; m.textContent=text; }

/* ===== 내 신청 확인 ===== */
async function onCheck(){
  const sid = $("chkSid").value.trim();
  if(!/^[0-9]{4,15}$/.test(sid)){ chkFlash("warn","학번을 숫자로 입력해 주세요."); return; }
  const btn=$("chkBtn"); const old=btn.textContent;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 조회 중…';
  try{
    const snap = await getDoc(doc(db,"signups",sid));
    if(!snap.exists()){
      chkFlash("bad","이 학번으로 접수된 신청이 없습니다.");
    } else {
      const d = snap.data();
      const ts = d.ts && d.ts.toDate ? d.ts.toDate().toLocaleString("ko-KR") : "-";
      if(d.status === "예비"){
        chkFlash("warn","🕗 "+d.name+"님 — 예비 "+d.wait+"번\n신청시각 "+ts+"\n자리가 나면 순서대로 연락드립니다.");
      } else if(d.status === "확정"){
        chkFlash("ok","✅ "+d.name+"님 — 확정 "+d.seq+"번\n신청시각 "+ts);
      } else {
        chkFlash("ok","✅ "+d.name+"님, 접수되었습니다.\n신청시각 "+ts+"\n정확한 순번은 집계 후 여기에 표시됩니다.");
      }
    }
  }catch(err){
    chkFlash("bad","조회 중 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
  }finally{
    btn.disabled=false; btn.textContent=old;
  }
}

async function onSubmit(e){
  e.preventDefault();
  const name=$("name").value.trim();
  const sid=$("sid").value.trim();
  $("msg").className="msg";
  if(!name || !sid){ flash("warn","이름과 학번을 모두 입력해 주세요."); return; }
  if(!/^[0-9]{4,15}$/.test(sid)){ flash("warn","학번은 숫자로 입력해 주세요."); return; }

  const btn=$("submitBtn"); const old=btn.textContent;
  btn.disabled=true; btn.innerHTML='<span class="spin"></span> 신청 중…';

  const stateRef=doc(db,"meta","state");
  const upRef=doc(db,"signups",sid);
  try{
    const [uSnap, sSnap] = await Promise.all([ getDoc(upRef), getDoc(stateRef) ]);
    if(!sSnap.exists()) throw {code:"nostate"};
    const st=sSnap.data();
    const now=Date.now();
    if(now < st.openTime) throw {code:"notopen"};
    if(st.closeTime && now > st.closeTime) throw {code:"closed"};
    if(uSnap.exists()) throw {code:"duplicate"};

    const batch = writeBatch(db);
    batch.set(upRef, { name, sid, ts: serverTimestamp() });
    batch.update(stateRef, { count: increment(1) });
    await batch.commit();

    btn.textContent=old;
    const seq=(st.count||0)+1;
    toSheet(name, sid, seq);
    if(seq <= st.capacity){
      flash("ok","✅ "+name+"님, 신청 완료! (약 "+seq+"/"+st.capacity+"번째)\n정확한 순번은 아래 '내 신청 확인'에서 집계 후 확인할 수 있어요.");
    } else {
      flash("warn","🕗 "+name+"님, 예비 접수 완료! (예비 약 "+(seq-st.capacity)+"번)\n자리가 나면 순서대로 연락드립니다.");
    }
    $("form").reset();
  }catch(err){
    btn.disabled=false; btn.textContent=old;
    const code=(err&&err.code)||"";
    if(code==="duplicate") flash("warn","이미 신청된 학번입니다. (중복 신청 불가)");
    else if(code==="notopen"){ flash("warn","아직 신청 시작 전입니다."); }
    else if(code==="closed"){ flash("bad","신청이 종료되었습니다."); }
    else if(code==="permission-denied"){ flash("bad","예비 접수까지 마감되었습니다."); }
    else flash("bad","일시적인 오류가 발생했어요. 잠시 후 다시 시도해 주세요.");
  }
}

// 매초 카운트다운/전환
setInterval(()=>{
  if(state.openTime==null) return;
  const now=Date.now();
  if(now < state.openTime - PREP_LEAD_MS){
    let diff=Math.floor((state.openTime-now)/1000);
    const d=Math.floor(diff/86400); diff%=86400;
    const h=Math.floor(diff/3600); diff%=3600;
    const m=Math.floor(diff/60); const s=diff%60;
    $("cd").textContent=pad(d); $("ch").textContent=pad(h); $("cm").textContent=pad(m); $("cs").textContent=pad(s);
  }
  render();
},1000);

if(configured) firebaseMode(); else demoMode();

/* ===== 배경 별 ===== */
(function(){
  const c=document.getElementById("sky"), x=c.getContext("2d"); let w,h,stars;
  function init(){ w=c.width=innerWidth; h=c.height=innerHeight;
    stars=Array.from({length:140},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.4+.3,a:Math.random(),s:Math.random()*.02+.005})); }
  function loop(){ x.clearRect(0,0,w,h);
    for(const st of stars){ st.a+=st.s; if(st.a>1||st.a<0) st.s*=-1; x.beginPath(); x.arc(st.x,st.y,st.r,0,7); x.fillStyle="rgba(200,215,255,"+Math.abs(st.a)+")"; x.fill(); }
    requestAnimationFrame(loop); }
  c.style.cssText="position:fixed;inset:0;z-index:0"; addEventListener("resize",init); init(); loop();
