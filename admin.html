<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정기관측회 신청 관리자</title>
<style>
  :root{ --bg:#0d1220; --card:#161d2e; --line:#27324a; --txt:#e8edf7; --muted:#93a0b8;
         --accent:#6ea8ff; --ok:#46d6a0; --warn:#ffd36e; --bad:#ff7a7a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 80px}
  h1{font-size:22px;margin:0 0 4px}
  .muted{color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--accent)}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px}
  input,select{width:100%;padding:10px 12px;font-size:14px;color:var(--txt);background:#0f1526;
    border:1px solid var(--line);border-radius:9px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > div{flex:1;min-width:180px}
  button{padding:10px 16px;font-size:14px;font-weight:700;border:0;border-radius:9px;cursor:pointer;
    background:var(--accent);color:#08101f}
  button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  button.danger{background:#3a1c22;color:#ffb3b3;border:1px solid #6b2b34}
  button:disabled{opacity:.5;cursor:not-allowed}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:13px;display:none}
  .msg.show{display:block}
  .msg.ok{background:rgba(70,214,160,.12);border:1px solid rgba(70,214,160,.4);color:#bff3df}
  .msg.warn{background:rgba(255,211,110,.12);border:1px solid rgba(255,211,110,.4);color:#ffe9b8}
  .msg.bad{background:rgba(255,122,122,.12);border:1px solid rgba(255,122,122,.4);color:#ffd2d2}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;
    background:#1d2740;color:var(--muted);border:1px solid var(--line)}
  .pill.live{background:rgba(110,168,255,.15);color:#bcd8ff;border-color:#33518a}
  .pill.test{background:rgba(255,211,110,.14);color:#ffe1a3;border-color:#7a6329}
  .hidden{display:none !important}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
  .stat b{font-size:19px}
  .split{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  code{background:#0f1526;padding:2px 6px;border-radius:5px;font-size:12px;color:#a8c4ef}
</style>
</head>
<body>
<div class="wrap">

  <div class="split">
    <div>
      <h1>정기관측회 신청 관리자</h1>
      <div class="muted" id="whoami">로그인이 필요합니다</div>
    </div>
    <div class="bar" style="margin:0">
      <button id="loginBtn">구글로 로그인</button>
      <button id="logoutBtn" class="ghost hidden">로그아웃</button>
    </div>
  </div>

  <div id="denied" class="card hidden">
    <h2>접근 권한 없음</h2>
    <div class="muted">이 계정은 관리자로 등록되어 있지 않습니다. 관리자 계정으로 다시 로그인해 주세요.</div>
  </div>

  <div id="panel" class="hidden">

    <div class="card">
      <div class="split">
        <h2 style="margin:0">대상 환경</h2>
        <div>
          <span class="pill live" id="envPill">실제 신청</span>
        </div>
      </div>
      <label for="env">어떤 환경을 관리할까요?</label>
      <select id="env">
        <option value="live">실제 신청 (신청 페이지)</option>
        <option value="test">테스트 (test.html)</option>
      </select>
      <div class="stat muted" style="margin-top:12px">
        <div>현재 인원 <b id="sCount">-</b></div>
        <div>정원 <b id="sCap">-</b></div>
        <div>상태 <b id="sState">-</b></div>
      </div>
    </div>

    <div class="card">
      <h2>화면에 표시할 정보</h2>
      <div class="row">
        <div><label for="fTitle">제목</label><input id="fTitle" placeholder="1차 정기관측회 신청" /></div>
        <div><label for="fTag">부제</label><input id="fTag" placeholder="페르세우스의 별빛 아래에서" /></div>
      </div>
      <div class="row">
        <div><label for="fDate">일시</label><input id="fDate" placeholder="2026년 9월 19일(토)~20일(일) 1박 2일" /></div>
        <div><label for="fPlace">장소</label><input id="fPlace" placeholder="파주 축제 펜션" /></div>
      </div>
      <label for="fContact">문의처</label><input id="fContact" placeholder="관측부장 이윤호 010-0000-0000" />
    </div>

    <div class="card">
      <h2>접수 설정</h2>
      <div class="row">
        <div><label for="fCap">정원 (명)</label><input id="fCap" type="number" min="1" max="10000" /></div>
        <div><label for="fOpen">신청 시작</label><input id="fOpen" type="datetime-local" /></div>
        <div><label for="fClose">신청 마감 (비워두면 없음)</label><input id="fClose" type="datetime-local" /></div>
      </div>
      <div class="bar">
        <button id="saveBtn">설정 저장</button>
        <button id="reloadBtn" class="ghost">다시 불러오기</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </div>

    <div class="card">
      <h2>구글 시트 자동 기록</h2>
      <div class="muted">시트 주소를 등록하면 신청이 들어올 때마다 그 시트에 자동으로 기록됩니다.</div>
      <label for="fSheet">시트 주소</label>
      <input id="fSheet" placeholder="https://docs.google.com/spreadsheets/d/....../edit" />
      <div class="bar">
        <button id="sheetBtn">시트 등록</button>
        <button id="syncBtn" class="ghost">지금 전체 동기화</button>
        <button id="openSheetBtn" class="ghost">시트 열기</button>
      </div>
      <div class="msg" id="sheetMsg"></div>
    </div>

    <div class="card">
      <div class="split">
        <h2 style="margin:0">신청자 명단</h2>
        <div class="bar" style="margin:0">
          <button id="listBtn" class="ghost">불러오기</button>
          <button id="csvBtn" class="ghost">CSV 저장</button>
        </div>
      </div>
      <div id="listBox" class="muted" style="margin-top:10px">불러오기를 눌러 주세요.</div>
    </div>

    <div class="card">
      <h2>초기화</h2>
      <div class="muted">신청자 기록을 모두 삭제하고 인원을 0으로 되돌립니다. 되돌릴 수 없습니다.</div>
      <div class="bar">
        <button id="resetBtn" class="danger">명단 전체 삭제 + 인원 0</button>
      </div>
      <div class="msg" id="resetMsg"></div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, deleteDoc, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDE4OxN_ZUNAvoNsXkBdj3nBeU30CXKesI",
  authDomain: "yaaa-observation.firebaseapp.com",
  projectId: "yaaa-observation",
  storageBucket: "yaaa-observation.firebasestorage.app",
  messagingSenderId: "797504088505",
  appId: "1:797504088505:web:cc444df6461c237deeee68"
};
const ADMIN_EMAIL = "songjun7734@gmail.com";
const BRIDGE = "https://script.google.com/macros/s/AKfycbzKblqEmZSMGShChP7gDwFWHiuWtnBwAirCC_R6ke2v-3-nWpdWY9UhU_O_mhsqLJPUAw/exec";
const BRIDGE_TOKEN = "yaaa-sheet-2026";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let ENV = 'live';
let rows = [];

const metaId = () => ENV === 'live' ? 'state' : 'test';
const colName = () => ENV === 'live' ? 'signups' : 'signups_test';

function flash(el, type, text){ const m=$(el); m.className='msg show '+type; m.textContent=text; }
function pad(n){ return String(n).padStart(2,'0'); }
function toLocalInput(ms){
  if(!ms) return '';
  const d=new Date(ms);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
function fromLocalInput(v){ return v ? new Date(v).getTime() : null; }
function fmt(ms){ return ms ? new Date(ms).toLocaleString('ko-KR') : '-'; }

/* 브리지 호출 */
function bridgeGet(params){
  return new Promise((res)=>{
    const cb='bcb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>{cleanup();res({ok:false,error:'timeout'})},12000);
    function cleanup(){ try{delete window[cb];}catch(e){} if(s.parentNode) s.remove(); clearTimeout(t); }
    window[cb]=d=>{cleanup();res(d);};
    const q=Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    s.src=BRIDGE+'?'+q+'&token='+encodeURIComponent(BRIDGE_TOKEN)+'&callback='+cb+'&t='+Date.now();
    s.onerror=()=>{cleanup();res({ok:false,error:'network'})};
    document.head.appendChild(s);
  });
}
function bridgePost(fields){
  const ifr=document.createElement('iframe'); ifr.style.display='none';
  ifr.name='bf_'+Math.random().toString(36).slice(2); document.body.appendChild(ifr);
  const f=document.createElement('form'); f.method='POST'; f.action=BRIDGE; f.target=ifr.name; f.acceptCharset='utf-8';
  const all=Object.assign({token:BRIDGE_TOKEN}, fields);
  for(const k in all){ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=all[k]; f.appendChild(i); }
  document.body.appendChild(f); f.submit();
  setTimeout(()=>{ try{f.remove(); ifr.remove();}catch(e){} }, 60000);
}

/* 인증 */
$('loginBtn').onclick = async ()=>{
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ alert('로그인 실패: '+(e.code||e.message)); }
};
$('logoutBtn').onclick = ()=> signOut(auth);

onAuthStateChanged(auth, (user)=>{
  if(!user){
    $('whoami').textContent='로그인이 필요합니다';
    $('loginBtn').classList.remove('hidden');
    $('logoutBtn').classList.add('hidden');
    $('panel').classList.add('hidden');
    $('denied').classList.add('hidden');
    return;
  }
  $('whoami').textContent = user.email;
  $('loginBtn').classList.add('hidden');
  $('logoutBtn').classList.remove('hidden');
  if(user.email !== ADMIN_EMAIL){
    $('denied').classList.remove('hidden');
    $('panel').classList.add('hidden');
    return;
  }
  $('denied').classList.add('hidden');
  $('panel').classList.remove('hidden');
  load();
  refreshSheet();
});

/* 설정 불러오기/저장 */
$('env').onchange = ()=>{
  ENV=$('env').value;
  $('envPill').textContent = ENV==='live' ? '실제 신청' : '테스트';
  $('envPill').className = 'pill '+(ENV==='live'?'live':'test');
  $('listBox').textContent='불러오기를 눌러 주세요.'; rows=[];
  load();
};

async function load(){
  const snap = await getDoc(doc(db,'meta',metaId()));
  if(!snap.exists()){ flash('saveMsg','bad','설정 문서를 찾을 수 없습니다.'); return; }
  const d=snap.data();
  $('fTitle').value = d.title || '';
  $('fTag').value = d.tagline || '';
  $('fDate').value = d.date || '';
  $('fPlace').value = d.place || '';
  $('fContact').value = d.contact || '';
  $('fCap').value = d.capacity ?? '';
  $('fOpen').value = toLocalInput(d.openTime);
  $('fClose').value = toLocalInput(d.closeTime);
  $('fSheet').value = d.sheetUrl || '';
  $('sCount').textContent = (d.count ?? 0)+'명';
  $('sCap').textContent = (d.capacity ?? 0)+'명';
  const now=Date.now();
  $('sState').textContent = (d.count>=d.capacity) ? '마감'
      : (d.closeTime && now>d.closeTime) ? '종료'
      : (now < d.openTime) ? '대기중' : '접수중';
}
$('reloadBtn').onclick = ()=>{ load(); flash('saveMsg','ok','다시 불러왔습니다.'); };

$('saveBtn').onclick = async ()=>{
  const cap = parseInt($('fCap').value,10);
  const open = fromLocalInput($('fOpen').value);
  if(!cap || cap<1){ flash('saveMsg','warn','정원을 확인해 주세요.'); return; }
  if(!open){ flash('saveMsg','warn','신청 시작 시각을 입력해 주세요.'); return; }
  const payload = {
    title:$('fTitle').value.trim(), tagline:$('fTag').value.trim(),
    date:$('fDate').value.trim(), place:$('fPlace').value.trim(),
    contact:$('fContact').value.trim(),
    capacity:cap, openTime:open, closeTime:fromLocalInput($('fClose').value)
  };
  try{
    await updateDoc(doc(db,'meta',metaId()), payload);
    flash('saveMsg','ok','저장했습니다. 신청 페이지에 즉시 반영됩니다. (시작 '+fmt(open)+')');
    load();
  }catch(e){ flash('saveMsg','bad','저장 실패: '+(e.code||e.message)); }
};

/* 시트 */
async function refreshSheet(){
  const r = await bridgeGet({action:'ping'});
  if(r && r.connected) flash('sheetMsg','ok','연결됨: '+r.title+' ('+r.tab+', '+r.rows+'행)');
  else flash('sheetMsg','warn','아직 시트가 등록되지 않았습니다.');
}
$('sheetBtn').onclick = async ()=>{
  const url=$('fSheet').value.trim();
  if(!url){ flash('sheetMsg','warn','시트 주소를 입력해 주세요.'); return; }
  flash('sheetMsg','warn','등록 중…');
  const r = await bridgeGet({action:'setSheet', sheetUrl:url});
  if(r && r.ok){
    try{ await updateDoc(doc(db,'meta',metaId()), {sheetUrl:url}); }catch(e){}
    flash('sheetMsg','ok','등록 완료: '+r.title+' ('+r.tab+')');
  } else {
    flash('sheetMsg','bad','등록 실패: '+((r&&r.error)||'알 수 없음')+' — 주소가 맞는지, 이 계정이 시트를 편집할 수 있는지 확인해 주세요.');
  }
};
$('openSheetBtn').onclick = ()=>{
  const u=$('fSheet').value.trim(); if(u) window.open(u,'_blank');
};
$('syncBtn').onclick = async ()=>{
  await fetchList();
  if(!rows.length){ flash('sheetMsg','warn','동기화할 명단이 없습니다.'); return; }
  bridgePost({action:'sync', rows:JSON.stringify(rows)});
  flash('sheetMsg','warn','동기화 요청을 보냈습니다. 잠시 후 확인합니다…');
  setTimeout(refreshSheet, 6000);
};

/* 명단 */
async function fetchList(){
  const qs = await getDocs(collection(db, colName()));
  rows = qs.docs.map(d=>{
    const v=d.data();
    const ts = v.ts && v.ts.toDate ? v.ts.toDate() : null;
    return { sid:v.sid||d.id, name:v.name||'', ts: ts? ts.toLocaleString('ko-KR') : '', _t: ts?ts.getTime():0 };
  }).sort((a,b)=>a._t-b._t).map((r,i)=>Object.assign(r,{seq:i+1}));
  return rows;
}
$('listBtn').onclick = async ()=>{
  $('listBox').textContent='불러오는 중…';
  try{
    await fetchList();
    if(!rows.length){ $('listBox').textContent='아직 신청자가 없습니다.'; return; }
    let h='<table><tr><th>순번</th><th>이름</th><th>학번</th><th>신청시각</th></tr>';
    rows.forEach(r=>{ h+='<tr><td>'+r.seq+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.sid)+'</td><td>'+esc(r.ts)+'</td></tr>'; });
    h+='</table>';
    $('listBox').innerHTML=h;
  }catch(e){ $('listBox').textContent='불러오기 실패: '+(e.code||e.message); }
};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('csvBtn').onclick = async ()=>{
  if(!rows.length) await fetchList();
  if(!rows.length){ alert('명단이 비어 있습니다.'); return; }
  const csv = '﻿순번,이름,학번,신청시각\n' +
    rows.map(r=>[r.seq, '"'+r.name+'"', '"'+r.sid+'"', '"'+r.ts+'"'].join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='신청자명단_'+(ENV==='live'?'실제':'테스트')+'.csv';
  a.click();
};

/* 초기화 */
$('resetBtn').onclick = async ()=>{
  if(!confirm('['+(ENV==='live'?'실제 신청':'테스트')+'] 명단을 모두 삭제하고 인원을 0으로 되돌립니다.\n계속할까요?')) return;
  flash('resetMsg','warn','삭제 중…');
  try{
    const qs = await getDocs(collection(db, colName()));
    let n=0;
    for(let i=0;i<qs.docs.length;i+=400){
      const b=writeBatch(db);
      qs.docs.slice(i,i+400).forEach(d=>{ b.delete(d.ref); n++; });
      await b.commit();
    }
    await updateDoc(doc(db,'meta',metaId()), {count:0});
    rows=[]; $('listBox').textContent='아직 신청자가 없습니다.';
    flash('resetMsg','ok', n+'건 삭제하고 인원을 0으로 되돌렸습니다.');
    load();
  }catch(e){ flash('resetMsg','bad','실패: '+(e.code||e.message)); }
};
</script>
</body>
</html>
